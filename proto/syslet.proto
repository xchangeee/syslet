syntax = "proto3";

package syslet.v1;

option go_package = "codeberg.org/xchangeee/syslet/proto;sysletv1";

service SysletService {
  // Container RPCs
  rpc ApplyContainer(ApplyContainerRequest) returns (ApplyContainerResponse);
  rpc GetContainer(GetContainerRequest) returns (GetContainerResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);

  // Volume RPCs
  rpc ApplyVolume(ApplyVolumeRequest) returns (ApplyVolumeResponse);
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);

  // Network RPCs
  rpc ApplyNetwork(ApplyNetworkRequest) returns (ApplyNetworkResponse);
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  rpc DeleteNetwork(DeleteNetworkRequest) returns (DeleteNetworkResponse);

  // Logs (container-only)
  rpc Logs(LogsRequest) returns (stream LogEntry);
}

// --- Enums ---

enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_RUNNING = 1;
  DESIRED_STATE_STOPPED = 2;
}

enum ActiveState {
  ACTIVE_STATE_UNSPECIFIED = 0;
  ACTIVE_STATE_ACTIVE = 1;
  ACTIVE_STATE_INACTIVE = 2;
  ACTIVE_STATE_FAILED = 3;
  ACTIVE_STATE_ACTIVATING = 4;
  ACTIVE_STATE_DEACTIVATING = 5;
}

// --- Shared building blocks ---

message UnitOption {
  string section = 1;
  string name = 2;
  string value = 3;
}

message ConfigEntry {
  string content = 1;
  string target_volume_path = 2;
}

// --- Specs ---

message ContainerSpec {
  string name = 1;
  DesiredState desired_state = 2;
  repeated UnitOption options = 3;
  repeated ConfigEntry configs = 4;
}

message VolumeSpec {
  string name = 1;
  repeated UnitOption options = 2;
}

message NetworkSpec {
  string name = 1;
  repeated UnitOption options = 2;
}

// --- Container RPCs ---

message ApplyContainerRequest {
  ContainerSpec spec = 1;
}

message ApplyContainerResponse {
  string name = 1;
  bool changed = 2;
  string message = 3;
}

message GetContainerRequest {
  string name = 1;
}

message GetContainerResponse {
  ContainerStatus container = 1;
}

message ListContainersRequest {}

message ListContainersResponse {
  repeated ContainerStatus containers = 1;
}

message DeleteContainerRequest {
  string name = 1;
}

message DeleteContainerResponse {
  string message = 1;
}

// --- Volume RPCs ---

message ApplyVolumeRequest {
  VolumeSpec spec = 1;
}

message ApplyVolumeResponse {
  string name = 1;
  bool changed = 2;
  string message = 3;
}

message GetVolumeRequest {
  string name = 1;
}

message GetVolumeResponse {
  VolumeStatus volume = 1;
}

message ListVolumesRequest {}

message ListVolumesResponse {
  repeated VolumeStatus volumes = 1;
}

message DeleteVolumeRequest {
  string name = 1;
}

message DeleteVolumeResponse {
  string message = 1;
}

// --- Network RPCs ---

message ApplyNetworkRequest {
  NetworkSpec spec = 1;
}

message ApplyNetworkResponse {
  string name = 1;
  bool changed = 2;
  string message = 3;
}

message GetNetworkRequest {
  string name = 1;
}

message GetNetworkResponse {
  NetworkStatus network = 1;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated NetworkStatus networks = 1;
}

message DeleteNetworkRequest {
  string name = 1;
}

message DeleteNetworkResponse {
  string message = 1;
}

// --- Status messages (spec + runtime state) ---

message ContainerStatus {
  string name = 1;
  DesiredState desired_state = 2;
  ActiveState active_state = 3;
  bool enabled = 4;
  repeated string config_files = 5;
  string last_applied = 6;
  string last_error = 7;
}

message VolumeStatus {
  string name = 1;
  ActiveState active_state = 2;
  bool enabled = 3;
  string last_applied = 4;
  string last_error = 5;
}

message NetworkStatus {
  string name = 1;
  ActiveState active_state = 2;
  bool enabled = 3;
  string last_applied = 4;
  string last_error = 5;
}

// --- Logs ---

message LogsRequest {
  string unit_name = 1;
  bool follow = 2;
  int32 lines = 3;
}

message LogEntry {
  string timestamp = 1;
  string message = 2;
  string priority = 3;
}
